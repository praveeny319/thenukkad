<div class="pg" id="pg-profile">
  <div class="profile-wrap">
    <div class="profile-header">
      <div class="profile-avatar" id="profile-avatar">👤</div>
      <div class="profile-name serif" id="profile-name">Your Profile</div>
      <div class="profile-email" id="profile-email"></div>
    </div>

    <div class="profile-card" id="profile-details-card">
      <div class="profile-card-title">Personal Details</div>
      <div class="profile-field"><span class="profile-field-label">Name</span><span class="profile-field-val" id="pf-name">—</span></div>
      <div class="profile-field"><span class="profile-field-label">Email</span><span class="profile-field-val" id="pf-email">—</span></div>
      <div class="profile-field"><span class="profile-field-label">WhatsApp</span><span class="profile-field-val" id="pf-phone">—</span></div>
      <div class="profile-field"><span class="profile-field-label">Location</span><span class="profile-field-val" id="pf-address">—</span></div>
    </div>

    <div id="profile-store-section">
      <div class="profile-card-title" style="margin-bottom:0.8rem">My Store</div>
      <div id="profile-store-wrap"></div>
    </div>
    <div id="my-orders-section" style="margin-top:1.5rem">
      <div class="profile-card-title" style="margin-bottom:0.8rem">My Orders</div>
      <div id="my-orders-list"></div>
    </div>
  </div>
</div>
